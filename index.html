<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkileşimli Spiral Galaksi ve AI Keşfi</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Kaydırma çubuklarını gizle */
            background-color: #000; /* Uzay siyahı */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block; /* Canvas'ın tam oturması için */
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none; /* Tıklamaların arkadaki canvas'a geçmesini sağlar */
            user-select: none;
            z-index: 10;
        }

        /* AI Panel Stilleri */
        #ai-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .ai-btn {
            background: rgba(20, 20, 40, 0.8);
            color: #4db8ff;
            border: 1px solid #4db8ff;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(77, 184, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-btn:hover {
            background: rgba(77, 184, 255, 0.2);
            box-shadow: 0 0 20px rgba(77, 184, 255, 0.4);
            transform: translateY(-2px);
        }

        .ai-btn.settings {
            border-color: #ffa500;
            color: #ffa500;
        }
        .ai-btn.settings:hover {
            background: rgba(255, 165, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.4);
        }

        /* Ortak Modal Stilleri */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            max-width: 90%;
            background: rgba(10, 15, 30, 0.95);
            border: 1px solid #4db8ff;
            border-radius: 10px;
            padding: 20px;
            color: #e0e0e0;
            display: none; /* Başlangıçta gizli */
            z-index: 20;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }

        #result-content {
            line-height: 1.6;
            font-size: 0.95rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(77, 184, 255, 0.3);
            padding-bottom: 10px;
        }

        .modal-title {
            color: #4db8ff;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .close-btn:hover {
            color: white;
        }

        /* Input Stilleri */
        .api-input {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #4db8ff;
            color: white;
            border-radius: 5px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        
        .save-btn {
            width: 100%;
            padding: 10px;
            background: #4db8ff;
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .save-btn:hover {
            background: #7eccff;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            margin: 0;
            font-size: 0.85rem;
            color: #aaa;
        }

        .controls-info {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #4db8ff;
        }

        /* Scrollbar tasarımı */
        #result-content::-webkit-scrollbar {
            width: 8px;
        }
        #result-content::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
        }
        #result-content::-webkit-scrollbar-thumb {
            background: #4db8ff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Bilgi Paneli -->
    <div id="ui-container">
        <h1>Spiral Galaksi</h1>
        <p>Prosedürel Parçacık Sistemi</p>
        <div class="controls-info">
            • Sol Tık: Döndür<br>
            • Sağ Tık: Kaydır (Pan)<br>
            • Tekerlek: Yakınlaş/Uzaklaş
        </div>
    </div>

    <!-- AI Kontrol Paneli -->
    <div id="ai-panel">
        <button class="ai-btn settings" id="btn-settings">
            <span>🔑</span> API Anahtarı
        </button>
        <button class="ai-btn" id="btn-story">
            <span>✨</span> Galaksi Hikayesi Oluştur
        </button>
        <button class="ai-btn" id="btn-explore">
            <span>✨</span> Yıldız Sistemi Keşfet
        </button>
        <button class="ai-btn" id="btn-signal">
            <span>📡</span> Sinyal Yakala
        </button>
    </div>

    <!-- Sonuç Modalı -->
    <div id="result-modal" class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modal-title">AI Analizi</span>
            <button class="close-btn" id="modal-close">&times;</button>
        </div>
        <div id="result-content">
            <!-- İçerik buraya gelecek -->
        </div>
    </div>

    <!-- Ayarlar (API Key) Modalı -->
    <div id="settings-modal" class="modal">
        <div class="modal-header">
            <span class="modal-title" style="color: #ffa500;">API Kurulumu</span>
            <button class="close-btn" id="settings-close">&times;</button>
        </div>
        <div style="font-size: 0.9rem; margin-bottom: 15px;">
            Gemini API özelliklerini kullanmak için anahtarınızı girin. 
            <br><span style="color: #888; font-size: 0.8rem;">(Tarayıcınızda güvenle saklanır)</span>
        </div>
        <input type="password" id="api-key-input" class="api-input" placeholder="AIza... ile başlayan anahtarınızı yapıştırın">
        <button id="save-api-key" class="save-btn">Kaydet ve Başla</button>
        <div style="margin-top: 10px; font-size: 0.8rem; color: #aaa;">
            <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color: #4db8ff;">Anahtarın yok mu? Buradan al.</a>
        </div>
    </div>

    <!-- Three.js ve Eklentileri için Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 1. SAHNE KURULUMU ---

        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.x = 3;
        camera.position.y = 3;
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. GALAKSİ PARAMETRELERİ ---
        
        const parameters = {
            count: 80000,
            size: 0.015,
            radius: 5,
            branches: 3,
            spin: 1,
            randomness: 0.2,
            randomnessPower: 3,
            insideColor: '#ff6030',
            outsideColor: '#1b3984'
        };

        let geometry = null;
        let material = null;
        let points = null;

        // --- 3. GALAKSİ OLUŞTURMA ---

        const generateGalaxy = () => {
            if (points !== null) {
                geometry.dispose();
                material.dispose();
                scene.remove(points);
            }

            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(parameters.count * 3);
            const colors = new Float32Array(parameters.count * 3);

            const colorInside = new THREE.Color(parameters.insideColor);
            const colorOutside = new THREE.Color(parameters.outsideColor);

            for (let i = 0; i < parameters.count; i++) {
                const i3 = i * 3;
                const radius = Math.random() * parameters.radius;
                const spinAngle = radius * parameters.spin;
                const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;

                const randomX = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                const randomY = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                const randomZ = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;

                positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i3 + 1] = randomY / 1.5;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                const mixedColor = colorInside.clone();
                mixedColor.lerp(colorOutside, radius / parameters.radius);

                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            material = new THREE.PointsMaterial({
                size: parameters.size,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);
        };

        generateGalaxy();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        const clock = new THREE.Clock();

        const tick = () => {
            const elapsedTime = clock.getElapsedTime();
            if(points) {
                points.rotation.y = elapsedTime * 0.05;
            }
            controls.update();
            renderer.render(scene, camera);
            window.requestAnimationFrame(tick);
        };

        tick();

        // --- 4. GÜVENLİ GEMINI API ENTEGRASYONU ---

        // DEĞİŞİKLİK: Artık API Key'i koddan almıyoruz. LocalStorage'dan alacağız.
        let apiKey = localStorage.getItem("gemini_api_key");
        
        const resultModal = document.getElementById('result-modal');
        const settingsModal = document.getElementById('settings-modal');
        const modalContent = document.getElementById('result-content');
        const modalTitle = document.getElementById('modal-title');
        
        const btnStory = document.getElementById('btn-story');
        const btnExplore = document.getElementById('btn-explore');
        const btnSignal = document.getElementById('btn-signal');
        const btnSettings = document.getElementById('btn-settings');
        
        const apiKeyInput = document.getElementById('api-key-input');
        const btnSaveKey = document.getElementById('save-api-key');

        // Modal Kapatma Fonksiyonları
        document.getElementById('modal-close').addEventListener('click', () => resultModal.style.display = 'none');
        document.getElementById('settings-close').addEventListener('click', () => settingsModal.style.display = 'none');

        // Ayarlar Butonu
        btnSettings.addEventListener('click', () => {
            apiKeyInput.value = apiKey || ""; // Varsa göster
            settingsModal.style.display = 'block';
        });

        // API Key Kaydetme
        btnSaveKey.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if(key) {
                localStorage.setItem("gemini_api_key", key);
                apiKey = key;
                settingsModal.style.display = 'none';
                alert("Anahtar kaydedildi! Artık özellikleri kullanabilirsiniz.");
            } else {
                alert("Lütfen geçerli bir anahtar girin.");
            }
        });

        // Gemini API Çağırma Fonksiyonu
        async function callGeminiAPI(prompt) {
            // GÜVENLİK KONTROLÜ: Anahtar var mı?
            if (!apiKey) {
                settingsModal.style.display = 'block'; // Yoksa ayarlar penceresini aç
                return;
            }

            modalContent.innerHTML = '<div style="text-align:center; padding: 20px;"><div class="loading-spinner"></div><br>Uzaydan veri alınıyor...</div>';
            resultModal.style.display = 'block';

            const systemPrompt = "Sen yaratıcı bir bilim kurgu yazarı ve astronomi uzmanısın. Cevapların Türkçe olsun.";

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    }
                );

                if (!response.ok) throw new Error("API Hatası");

                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sinyal koptu.";
                
                const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                typeWriterEffect(formattedText, modalContent);

            } catch (error) {
                console.error(error);
                modalContent.innerHTML = '<span style="color: #ff4d4d;">Hata: API Anahtarı geçersiz veya kota doldu.<br>Lütfen ayarlardan anahtarınızı kontrol edin.</span>';
            }
        }

        function typeWriterEffect(htmlText, element) {
            element.innerHTML = htmlText; 
            element.style.opacity = 0;
            let opacity = 0;
            const fadeIn = setInterval(() => {
                opacity += 0.1;
                element.style.opacity = opacity;
                if(opacity >= 1) clearInterval(fadeIn);
            }, 30);
        }

        // --- BUTON OLAYLARI ---

        btnStory.addEventListener('click', () => {
            modalTitle.innerText = "Galaktik Veri Günlüğü";
            const prompt = `Ekranda ${parameters.branches} kollu, ${parameters.insideColor} merkezli bir galaksi var. Buna isim ver, tarihini anlat ve medeniyetinden bahset.`;
            callGeminiAPI(prompt);
        });

        btnExplore.addEventListener('click', () => {
            modalTitle.innerText = "Sistem Taraması";
            const prompt = `Galaksinin rastgele bir sektöründeki tekil bir yıldız sistemini tara. Gezegenleri ve yaşamı anlat.`;
            callGeminiAPI(prompt);
        });

        btnSignal.addEventListener('click', () => {
            modalTitle.innerText = "Şifreli Mesaj";
            const prompt = `Bize gizemli, şifreli bir uzaylı mesajı gönder.`;
            callGeminiAPI(prompt);
        });

        // Sayfa açıldığında anahtar yoksa hatırlat
        if(!apiKey) {
            setTimeout(() => {
                // Kullanıcıyı hemen boğmamak için 1 sn sonra ayarlar butonu parlasın/dikkat çeksin
                btnSettings.style.animation = "pulse 2s infinite";
            }, 1000);
        }

    </script>
</body>
</html>
